
services:
  postgres:
    image: postgres:16
    container_name: charkool-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: charkool_dev
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
